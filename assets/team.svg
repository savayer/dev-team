<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 476 590" width="476" height="590" role="img" aria-label="Owner gives a task to the main session, which briefs head-pm on Opus in its own worktree; head-pm picks the level: small (head-pm codes it, Opus), feature (leads and QA on Sonnet), heavy (leads and QA on Opus); then QA if planned, reviewer on Opus, PR, green CI, merge; when stuck, feature is raised to heavy, then Blocked and the Owner decides.">
  <!-- Source of assets/team.png: edit here, re-render at 2x -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap');
    .bg { fill: #F4F5F2; }
    .node { fill: #FFFFFF; stroke: #8B959A; stroke-width: 1.2; }
    .pill { fill: #1B2124; }
    .edge { stroke: #66727A; stroke-width: 1.4; fill: none; }
    .head { fill: #66727A; }
    .title { font: 600 15px "Archivo", "Helvetica Neue", Arial, sans-serif; fill: #1B2124; }
    .level { font: 600 15px "Archivo", "Helvetica Neue", Arial, sans-serif; fill: #2357B5; }
    .owner { font: 600 15px "Archivo", "Helvetica Neue", Arial, sans-serif; fill: #F4F5F2; }
    .line { font: 400 11.5px "IBM Plex Mono", Menlo, Consolas, monospace; fill: #59636A; }
    .label { font: 400 11px "IBM Plex Mono", Menlo, Consolas, monospace; fill: #59636A; }
    .chip-opus { fill: #B0442A; }
    .chip-sonnet { fill: #1F7563; }
    .chip-neutral { fill: none; stroke: #8B959A; }
    .chip-text { font: 500 10.5px "IBM Plex Mono", Menlo, Consolas, monospace; fill: #FFFFFF; }
    .chip-text-neutral { font: 500 10.5px "IBM Plex Mono", Menlo, Consolas, monospace; fill: #59636A; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="476" height="590"/>

  <rect class="pill" x="178" y="12" width="120" height="34" rx="17"/>
  <text class="owner" x="238" y="34" text-anchor="middle">Owner</text>
  <line class="edge" x1="238" y1="46" x2="238" y2="66" marker-end="url(#arr)"/>

  <rect class="node" x="16" y="68" width="444" height="92" rx="6"/>
  <text class="title" x="32" y="92">Main session — dispatcher</text>
  <rect class="chip-neutral" x="340" y="80" width="108" height="18" rx="3"/>
  <text class="chip-text-neutral" x="394" y="93" text-anchor="middle">session model</text>
  <text class="line" x="32" y="114">checks, intake, queue: TEAM_MAX_TASKS</text>
  <text class="line" x="32" y="132">tracker, report to the Owner</text>
  <text class="line" x="32" y="150">doesn't pick the level</text>

  <line class="edge" x1="238" y1="160" x2="238" y2="180" marker-end="url(#arr)"/>
  <text class="label" x="248" y="174">brief, own worktree</text>

  <rect class="node" x="16" y="182" width="444" height="80" rx="6"/>
  <text class="title" x="32" y="206">head-pm</text>
  <rect class="chip-opus" x="394" y="194" width="54" height="18" rx="3"/>
  <text class="chip-text" x="421" y="207" text-anchor="middle">Opus</text>
  <text class="line" x="32" y="230">plan, contract; picks the level and QA</text>
  <text class="line" x="32" y="250">acceptance, PR, green CI, merge</text>

  <line class="edge" x1="238" y1="262" x2="238" y2="274"/>
  <line class="edge" x1="88" y1="274" x2="388" y2="274"/>
  <line class="edge" x1="88" y1="274" x2="88" y2="294" marker-end="url(#arr)"/>
  <line class="edge" x1="238" y1="274" x2="238" y2="294" marker-end="url(#arr)"/>
  <line class="edge" x1="388" y1="274" x2="388" y2="294" marker-end="url(#arr)"/>

  <rect class="node" x="16" y="296" width="144" height="110" rx="6"/>
  <text class="level" x="28" y="320">small</text>
  <rect class="chip-opus" x="96" y="308" width="54" height="18" rx="3"/>
  <text class="chip-text" x="123" y="321" text-anchor="middle">Opus</text>
  <text class="line" x="28" y="346">1–2 files,</text>
  <text class="line" x="28" y="364">obvious fix</text>
  <text class="line" x="28" y="388">head-pm codes it</text>

  <rect class="node" x="166" y="296" width="144" height="110" rx="6"/>
  <text class="level" x="178" y="320">feature</text>
  <rect class="chip-sonnet" x="240" y="308" width="60" height="18" rx="3"/>
  <text class="chip-text" x="270" y="321" text-anchor="middle">Sonnet</text>
  <text class="line" x="178" y="346">regular feature</text>
  <text class="line" x="178" y="364">leads, QA: Sonnet</text>
  <text class="line" x="178" y="388">+ middle if needed</text>

  <rect class="node" x="316" y="296" width="144" height="110" rx="6"/>
  <text class="level" x="328" y="320">heavy</text>
  <rect class="chip-opus" x="396" y="308" width="54" height="18" rx="3"/>
  <text class="chip-text" x="423" y="321" text-anchor="middle">Opus</text>
  <text class="line" x="328" y="346">risk or scale</text>
  <text class="line" x="328" y="364">leads, QA: Opus</text>
  <text class="line" x="328" y="388">+ senior, middle</text>

  <line class="edge" x1="88" y1="406" x2="88" y2="418" marker-end="url(#arr)"/>
  <line class="edge" x1="238" y1="406" x2="238" y2="418" marker-end="url(#arr)"/>
  <line class="edge" x1="388" y1="406" x2="388" y2="418" marker-end="url(#arr)"/>

  <rect class="node" x="16" y="420" width="444" height="84" rx="6"/>
  <text class="title" x="32" y="444">Common path</text>
  <text class="line" x="32" y="466">QA if head-pm plans it → reviewer on Opus</text>
  <text class="line" x="32" y="486">PR → merge mode only: green CI → merge · no release</text>

  <rect class="node" x="16" y="518" width="444" height="56" rx="6"/>
  <text class="title" x="32" y="542">Stuck</text>
  <text class="line" x="32" y="562">feature → heavy on Opus → Blocked → Owner</text>
</svg>
